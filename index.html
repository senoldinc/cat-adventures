<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd88a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Minnoş: Büyük Ev Macerası</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hearts" class="pill"></div>
      <div class="pill"><span class="kibble-icon"></span><span id="kibble-count">0</span></div>
      <div id="bones" class="pill"></div>
      <div id="bell" class="pill dim">🔔</div>
    </div>
    <div id="timer" class="pill timer hidden">⏱️ <span>0.0</span></div>
    <button id="btn-pause" class="round-btn" aria-label="Duraklat">⏸️</button>
    <div id="task" class="task"></div>
    <div id="hint" class="hint hidden"><span class="hint-icon"></span><span class="hint-text"></span></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Touch controls -->
  <div id="touch" class="hidden">
    <div id="stick-zone">
      <div id="stick" class="glass">
        <span class="arrow up">▲</span><span class="arrow down">▼</span>
        <span class="arrow left">◀</span><span class="arrow right">▶</span>
        <div id="stick-knob"></div>
      </div>
    </div>
    <button id="btn-meow" class="touch-btn glass meow" aria-label="Miyav">😺</button>
    <button id="btn-paw" class="touch-btn glass b" aria-label="Pati at"><b>B</b><span>🐾</span></button>
    <button id="btn-jump" class="touch-btn glass a" aria-label="Zıpla"><b>A</b><span>⬆️</span></button>
  </div>

  <!-- Menus -->
  <div id="screens"></div>

  <div id="rotate-hint" class="hidden">📱↻ Telefonu yan çevir!</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
